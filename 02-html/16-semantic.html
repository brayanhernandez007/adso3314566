<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 - Semantic</title>
    <link rel="stylesheet" href="../src/css/html.css">
    <style>
        /* ===================== */
        /* STRUCTURE MODERNO */
        /* ===================== */

        .estructura-semantica {
            text-align: center;
        }

        /* CONTENEDOR PRINCIPAL - AHORA RESPONSIVE */
        #contenedor-semantico {
            margin: 0 auto;
            background: #1a1a1a;
            width: 100%;
            max-width: 750px;
            padding: 15px;
            border-radius: 15px;
            box-sizing: border-box;
        }

        /* BLOQUES PRINCIPALES */
        .encabezado,
        .nav,
        .pie {
            background: #ff902f;
            margin: 15px auto;
            padding: 12px;
            width: 90%;
            max-width: 90%;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* CONTENIDO CENTRAL */
        .contenido-semantico {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        /* ARTICLE */
        .article {
            background: #cc6e1f;
            padding: 20px;
            width: 45%;
            min-width: 200px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* SECTION */
        .section {
            background: #ff902f;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            width: 90%;
            box-sizing: border-box;
        }

        /* ASIDE */
        .aside {
            background: #cc6e1f;
            padding: 20px;
            width: 25%;
            min-width: 150px;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .contenido-semantico {
                flex-direction: column;
                align-items: center;
            }
            
            .article,
            .aside {
                width: 90%;
            }
            
            .encabezado,
            .nav,
            .pie {
                width: 95%;
            }
        }
        
        /* Asegurar que todo quede dentro del contenedor negro */
        .caja-negra-individual {
            overflow-x: auto;
        }
        
        .caja-negra-individual * {
            max-width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="../02-html/index2.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">

                </svg>
            </a>
            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path>

        <br><br>

        <header>
            <h1>16 - Semantic</h1>
            <h2>Define la estructura con etiquetas semánticas (estilo nuevo).</h2>
        </header>

        <br>

        <div class="caja-negra-individual">
            
            <div class="estructura-semantica">
                <div id="contenedor-semantico">
                    <div class="encabezado">Encabezado</div>
                    <div class="nav">Nav</div>
                    <div class="contenido-semantico">
                        <div class="article">
                            Article
                            <div class="section">Section</div>
                        </div>
                        <div class="aside">Aside</div>
                    </div>
                    <div class="pie">Footer</div>
                </div>
            </div>
        </div>
    </main>
