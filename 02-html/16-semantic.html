<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 - Semantic</title>
    <link rel="stylesheet" href="../src/css/html.css">
</head>
<style>
    /* ===================== */
    /* STRUCTURE MODERNO */
    /* ===================== */

    .estructura {
        font-family: "Roboto Slab", serif;
        text-align: center;
        background: black;
        padding: 20px;
        border-radius: 15px;
    }

    /* CONTENEDOR */
    #contenedor {
        margin: 95px auto;
        background: #1a1a1a;
        width: 750px;
        padding: 15px;
        border-radius: 15px;
    }

    /* BLOQUES PRINCIPALES */
    .encabezado,
    .nav,
    .pie {
        background: #ff902f;
        /* naranja claro */
        margin: 15px auto;
        padding: 12px;
        width: 80%;
        border-radius: 10px;
        color: white;
        font-weight: bold;
    }

    /* CONTENIDO CENTRAL */
    .contenido {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin: 20px 0;
    }

    /* ARTICLE */
    .article {
        background: #cc6e1f;
        /* naranja oscuro */
        padding: 20px;
        width: 45%;
        border-radius: 12px;
        color: white;
        font-weight: bold;

        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* SECTION */
    .section {
        background: #ff902f;
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        width: 90%;
        box-sizing: border-box;
        
    }

    .article section {
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* ASIDE */
    .aside {
        background: #cc6e1f;
        padding: 20px;
        width: 25%;
        border-radius: 12px;
        color: white;
        font-weight: bold;
    }

    
</style>

<body>
    <main>

        <br>
        <br>
        <main>
            <header>
                <h1>16 - Semantic</h1>
                <h2>Define la estructura con etiquetas semánticas (estilo nuevo).</h2>
            </header>
            <section class="estructura">

                <h2>15 - Structure</h2>

                <div id="contenedor">

                    <div class="encabezado">Encabezado</div>

                    <div class="nav">Nav</div>

                    <div class="contenido">
                        <div class="article">
                            Article
                            <div class="section">Section</div>
                        </div>

                        <div class="aside">Aside</div>
                    </div>

                    <div class="pie">Footer</div>

                </div>

            </section>
        </main>
