<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 - Challenge Tables</title>
    <link rel="stylesheet" href="../src/css/html.css">
</head>

<style>
    body {
        background-color: #ff902f;
        /* 🔥 fondo igual a tus otras páginas */
        font-family: "Roboto Slab", serif;
    }

    section {
        display: flex;
        justify-content: center;
    }

    /* TABLA */
    .tabla-reto {
        border-collapse: collapse;
        margin-top: 20px;
    }

    /* CELDAS */
    .tabla-reto td {
        width: 70px;
        height: 70px;
        border: 3px solid #ccc;
        text-align: center;
        font-size: 28px;
        color: white;
    }

    /* gris SOLO si NO es negro */
    .tabla-reto td:not(.negro) {
        background: #3a3a3a;
    }

    /* negro con prioridad */
    .negro {
        background: black !important;
    }

    /* CELDAS NEGRAS (con 😎) */
    .negro {
        background: black;
    }

    h1,
    h2 {
        text-align: center;
        color: black;
    }
</style>

<body>
    <main>
        <div class="contenedor-botones">

            <a href="../02-html/index2.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path
                        d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path
                        d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>
        </div>

        <br><br>

        <main>
            <header>
                <h1>10 - Challenge Tables</h1>
                <h2>Practica la creación y estructura de tablas.</h2>
            </header>

            <section>

                <table class="tabla-reto">
                    <tr>
                        <td colspan="3"></td>
                        <td class="negro">😎</td>
                        <td colspan="2"></td>
                    </tr>

                    <tr>
                        <td colspan="2"></td>
                        <td class="negro">😎</td>
                        <td class="negro" rowspan="2">😎</td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td class="negro">😎</td>
                        <td></td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td class="negro">😎</td>
                        <td colspan="2" class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td class="negro">😎</td>
                        <td colspan="3" class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td></td>
                        <td class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td colspan="2"></td>
                        <td class="negro">😎</td>
                        <td></td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td colspan="2"></td>
                        <td class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td class="negro">😎</td>
                        <td></td>
                    </tr>

                    <tr>
                        <td colspan="3"></td>
                        <td class="negro">😎</td>
                        <td colspan="2"></td>
                    </tr>
                </table>

            </section>
        </main>

</body>

</html>
