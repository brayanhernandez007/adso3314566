<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.5 - Challenge Tables</title>
    <link rel="stylesheet" href="../src/css/html.css">

    <style>
        .tabla-reto {
            border-collapse: collapse;
            margin: 0 auto;
        }

        .tabla-reto td {
            width: 70px;
            height: 70px;
            border: 3px solid #e5e5e5;
            text-align: center;
            font-size: 30px;
            font-weight: bold;
        }

        /* Fondo gris */
        .gris {
            background-color: #333;
        }

        /* Fondo negro */
        .negra {
            background-color: black;
        }

        .caja-negra-individual {
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <main>

        <div class="contenedor-botones">

            <a href="../02-html/index2.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000"
                    viewBox="0 0 256 256">
                    <path
                        d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000"
                    viewBox="0 0 256 256">
                    <path
                        d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>

        </div>

        <br><br>

        <header>
            <h1>10.5 - Challenge Tables</h1>
            <h2>Practica la creación y estructura de tablas con 😎</h2>
        </header>

        <br>
        
        <div class="caja-negra-individual">

            <table class="tabla-reto">

                <!-- FILA 1 -->
                <tr>
                    <td class="gris" colspan="4"></td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="3"></td>
                </tr>

                <!-- FILA 2 -->
                <tr>
                    <td class="gris" colspan="3"></td>
                    <td class="negra">😎</td>
                    <td class="negra" rowspan="2">😎</td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="2"></td>
                </tr>

                <!-- FILA 3 -->
                <tr>
                    <td class="gris" colspan="2"></td>
                    <td class="negra">😎</td>
                    <td class="gris"></td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="2"></td>
                </tr>

                <!-- FILA 4 -->
                <tr>
                    <td class="gris"></td>
                    <td class="negra">😎</td>
                    <td class="negra" colspan="3">😎</td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="2"></td>
                </tr>

                <!-- FILA 5 -->
                <tr>
                    <td class="negra">😎</td>
                    <td class="negra" colspan="5">😎</td>
                    <td class="negra">😎</td>
                    <td class="gris"></td>
                </tr>

                <!-- FILA 6 -->
                <tr>
                    <td class="gris"></td>
                    <td class="negra">😎</td>
                    <td class="negra" colspan="3">😎</td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="2"></td>
                </tr>

                <!-- FILA 7 -->
                <tr>
                    <td class="gris" colspan="2"></td>
                    <td class="negra">😎</td>
                    <td class="gris"></td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="3"></td>
                </tr>

                <!-- FILA 8 -->
                <tr>
                    <td class="gris" colspan="3"></td>
                    <td class="negra">😎</td>
                    <td class="negra">😎</td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="2"></td>
                </tr>

                <!-- FILA 9 -->
                <tr>
                    <td class="gris" colspan="4"></td>
                    <td class="negra">😎</td>
                    <td class="gris" colspan="3"></td>
                </tr>

            </table>

        </div>

    </main>

</body>

</html>
