<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - List</title>
    <link rel="stylesheet" href="../src/css/html.css">
    <style>
        .caja-negra-individual {
            text-align: center;
        }
        
        .caja-negra-individual h3 {
            text-align: center;
            display: block;
        }
        
        /* Contenedor de la lista para que quede centrada pero el texto alineado a la izquierda */
        .list-wrapper {
            display: flex;
            justify-content: center;
        }
        
        .caja-negra-individual ul,
        .caja-negra-individual ol {
            text-align: left;
            margin: 0;
            padding-left: 20px;
        }
        
        .caja-negra-individual li {
            color: #ddd;
            margin: 5px 0;
        }
        
        /* Estructura correcta de listas anidadas */
        .caja-negra-individual ul ul,
        .caja-negra-individual ol ol {
            margin-left: 25px;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="../02-html/index2.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z"></path>
                </svg>
            </a>
            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z"></path>
                </svg>
            </a>
        </div>
        <br><br>

        <header>
            <h1>07 - List</h1>
            <h2>Crea listas ordenadas y desordenadas.</h2>
        </header>

        <!-- CONTENEDOR 1: Unordered List -->
        <div class="caja-negra-individual">
            <h3>Unordered List (ul)</h3>
            <div class="list-wrapper">
                <ul>
                    <li>Python
                        <ul>
                            <li>Flask</li>
                            <li>Django</li>
                        </ul>
                    </li>
                    <li>Java</li>
                    <li>JavaScript</li>
                    <li>C#</li>
                </ul>
            </div>
        </div>

        <!-- CONTENEDOR 2: Ordered List -->
        <div class="caja-negra-individual">
            <h3>Ordered List (ol)</h3>
            <div class="list-wrapper">
                <ol type="I">
                    <li>Jujutsu Kaisen
                        <ol type="a">
                            <li>Itadori</li>
                            <li>Gojo</li>
                            <li>Toji</li>
                        </ol>
                    </li>
                    <li>Frieren</li>
                    <li>Hell's Paradise</li>
                    <li>Journal With Wich</li>
                </ol>
            </div>
        </div>
    </main>
</body>

</html>
