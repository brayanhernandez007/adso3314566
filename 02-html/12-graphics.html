<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 - Graphics</title>
    <link rel="stylesheet" href="../src/css/html.css">

    <style>
        .graficos {
            text-align: center;
        }

        /* 🔥 SOLO AFECTA LOS GRAFICOS */
        .graficos svg,
        .graficos canvas {
            display: block;
            margin: 10px auto;
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        p {
            font-weight: bold;
            margin-top: 15px;
        }

        h2 {
            font-family: "Roboto Slab", serif;
            color: #ff902f;
        }
    </style>
</head>

<body>
    <main>

        <!-- BOTONES (NO SE TOCAN) -->
        <div class="contenedor-botones">
            <a href="../02-html/index2.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path
                        d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000" viewBox="0 0 256 256">
                    <path
                        d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>
        </div>

        <header>
            <h1>12 - Graphics</h1>
            <h2>Crea gráficos en línea con etiquetas.</h2>
        </header>

        <!-- GRAFICOS -->
        <section class="graficos">
            <h2>svg</h2>

            <p>Cuadrado</p>
            <svg width="120" height="120">
                <rect x="20" y="20" width="80" height="80" fill="red"></rect>
            </svg>

            <p>Rectángulo</p>
            <svg width="150" height="100">
                <rect x="15" y="20" width="120" height="60" fill="orange"></rect>
            </svg>

            <p>Círculo</p>
            <svg width="120" height="120">
                <circle cx="60" cy="60" r="40" fill="blue"></circle>
            </svg>

            <h2>Canvas</h2>
            <canvas id="miCanvas" width="300" height="200"></canvas>
        </section>

    </main>

    <!-- SCRIPT BIEN UBICADO -->
    <script>
        const canvas = document.getElementById("miCanvas");

        if (canvas) {
            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "red";
            ctx.fillRect(10, 10, 80, 80);

            ctx.fillStyle = "orange";
            ctx.fillRect(110, 10, 120, 60);

            ctx.beginPath();
            ctx.arc(80, 150, 40, 0, Math.PI * 2);
            ctx.fillStyle = "blue";
            ctx.fill();
        }
    </script>

</body>

</html>
