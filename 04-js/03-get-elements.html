<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 - Get Elements</title>
    <link rel="stylesheet" href="../src/css/js.css">
    <style>
        section {
            ul {
                padding: 0;
            }

            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="../04-js/index4.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path
                        d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path
                        d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>

        </div>

        <header>
            <h1>Get Elements</h1>
            <h2>Access and manipulate HTML elements using JavaScript</h2>
            <section>
                <h3>Get Element By Id:</h3>
                <h4 id="year"></h4>
                <h3>Get Elements By Tag Name:</h3>
                <ul>
                    <li>🍎</li>
                    <li>🫐</li>
                    <li>🍊</li>
                    <li>🍒</li>
                </ul>
                <h4></h4>
                <h3>Get Elements By Class Name</h3>
                <p class="paragraph">Lorem ipsum dolor</p>
                <p class="paragraph">Lorem ipsum dolor</p>
                <p class="paragraph">Lorem ipsum dolor</p>
                <h3>Query Selector & Query Selector All</h3>
                <figure class="animal first">🦊</figure>
                <figure class="animal">🐼</figure>
                <figure class="animal">🐷</figure>
            </section>
            <h3></h3>
        </section>
    </main>
    <script>
        //Get element by Id
        const year = document.getElementById('year');
        const ndate = new Date();
        year.textContent = `Current Year: ${ndate.getFullYear()}`;

        //Get elements by Tag Name
        const fruits = document.getElementsByTagName('li');
        const h4s = document.getElementsByTagName('h4');

        h4s[1].textContent = `There are ${fruits.length} fruits.`;
        h4s[1].innerHTML += `<br> The first fruit is: ${fruits[0].textContent}`;
        h4s[1].innerHTML += `<br> The last fruit is: ${fruits[fruits.length - 1].textContent}`;

        //Get elements by Class Name        
        const ps = document.getElementsByClassName('paragraph');
        ps[1].textContent = 'New text value';
        ps[1].style.backgroundColor = 'crimson'; // Corregido: crimson
        ps[1].style.color = 'white';
        ps[1].style.padding = '0.4rem';

        //Query Selector & Query Selector All
        const first = document.querySelector('figure.first')
        first.style.backgroundColor = 'orange'

        const animals = document.querySelectorAll('figure.animal')

        animals.forEach(animal => {
            animal.style.borderRadius = '50%'
            animal.style.backgroundColor = 'orange'
        });

    </script>
</body>

</html>
