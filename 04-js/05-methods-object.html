<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05 - Methods in Objects</title>
    <link rel="stylesheet" href="../src/css/js.css">
    <link rel="stylesheet" href="css/animate.min.css">
    <style>
        main section h3.pk-name {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 2 rem;
        }
        main section h4 {
            background-color: #fff9;
            color: #0009;
            border-radius: 4px;
            text-align: center;
            font-size: 1.6rem;
            margin: 0 auto;
            padding: 0.4rem 1rem;
            width: fit-content;
        }

        main section figure {
            background-repeat: no-repeat;
            padding: 0;
            display: flex;
            justify-content: center;
            margin: 0 auto;
            height: 192px;
            width: 202px;
            position: relative;
            background-position-x: 0px;
        }
        main section figure.alive {
            background-position-x: 0px;
        }
        main section figure.attack {
            background-position-x: -202px;
        }
        main section figure.feed {
            background-position-x: -404px;
        }
        main section figure.dead {
            background-position-x: -606px;
        }

        /* Overlay para mostrar +25 / -25 */
        main section figure .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.5);
            pointer-events: none;
            opacity: 0;
            transition: none;
            z-index: 10;
        }
        main section figure .overlay.show {
            animation: floatUp 0.8s ease-out forwards;
        }
        main section figure .overlay.positive {
            color: #4caf50;
        }
        main section figure .overlay.negative {
            color: #ff4444;
        }
        main section figure .overlay.dead-text {
            color: #ff0000;
            font-size: 5rem;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -80%) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -120%) scale(1);
            }
        }

        /* Animación de muerte - diferente a rubberBand */
        @keyframes deathAnimation {
            0% {
                transform: scale(1) rotate(0deg);
            }
            20% {
                transform: scale(1.1) rotate(-10deg);
            }
            40% {
                transform: scale(0.8) rotate(10deg);
            }
            60% {
                transform: scale(1.05) rotate(-5deg);
            }
            80% {
                transform: scale(0.9) rotate(5deg);
            }
            100% {
                transform: scale(0.85) rotate(0deg);
            }
        }

        main section figure.death-animation {
            animation: deathAnimation 0.9s ease-in-out forwards;
        }

        main section div.actions {
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: 150px;
            button {
                background: #fff9;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                padding: 0.4rem 1rem;
                transition: transform 0.2s ease-in;
                &:hover {
                    transform: scale(1.2);
                }
                &:disabled {
                    opacity: 0.5;
                    cursor: not-allowed;
                    transform: none !important;
                    &:hover {
                        transform: none !important;
                    }
                }
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="../04-js/index4.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>

        </div>

        <header>
            <h1>Methods in Objects</h1>
            <h2>Use methods to interact with objects</h2>
        </header>

        <section>
            <h3 class="pk-name"></h3>
            <h4 class="pk-hp"></h4>
            <figure class="pk-image animate__animated">
                <span class="overlay" id="overlayText"></span>
            </figure>
            <div class="actions">
                <button class="btn-attack">Attack</button>
                <button class="btn-feed">Feed</button>
            </div>
        </section>
    </main>
    <script>
        // Elements
        const pkName = document.querySelector('.pk-name');
        const pkHp = document.querySelector('.pk-hp');
        const pkImage = document.querySelector('.pk-image');
        const overlay = document.getElementById('overlayText');

        // Botones
        const btnAttack = document.querySelector('.btn-attack');
        const btnFeed = document.querySelector('.btn-feed');

        // Object
        const pokemon = {
            // Attributes
            name: 'Snorlax',
            type: 'Normal',
            hp: 100,
            maxHp: 200,
            image: 'imgs/snorlax-sprite.png',
            status: 'alive',
            isDead: false,

            // Methods
            render: function() {
                pkName.innerHTML = `${this.name} <small>[${this.type}]</small>`;
                pkImage.style.backgroundImage = `url(${this.image})`;
                this.updateHp('animate__rubberBand');
            },

            updateHp: function(fx) {
                pkHp.innerHTML = `HP: ${this.hp}`;
                
                // Primero remover todas las clases
                pkImage.classList.remove('alive', 'attack', 'feed', 'dead', 'animate__rubberBand', 'animate__headShake', 'animate__flash', 'death-animation');
                
                // Agregar el estado y la animación
                pkImage.classList.add(this.status);
                
                // Si hay animación, agregarla
                if (fx) {
                    pkImage.classList.add(fx);
                    setTimeout(() => {
                        pkImage.classList.remove(fx);
                    }, 900);
                }

                // Actualizar estado de los botones
                this.updateButtons();
            },

            updateButtons: function() {
                // Desactivar botón de feed solo si está en maxHP
                if (this.hp >= this.maxHp) {
                    btnFeed.disabled = true;
                } else {
                    btnFeed.disabled = false;
                }

                // Desactivar botón de attack si está muerto
                if (this.isDead) {
                    btnAttack.disabled = true;
                } else {
                    btnAttack.disabled = false;
                }
            },

            showOverlay: function(text, type) {
                // No mostrar overlay si no hay texto o es "+0"
                if (!text || text === '+0') {
                    return;
                }
                
                overlay.textContent = text;
                overlay.className = 'overlay';
                if (type === 'positive') {
                    overlay.classList.add('positive');
                } else if (type === 'negative') {
                    overlay.classList.add('negative');
                } else if (type === 'dead') {
                    overlay.classList.add('dead-text');
                }
                // Force reflow
                void overlay.offsetWidth;
                overlay.classList.add('show');
                setTimeout(() => {
                    overlay.classList.remove('show');
                }, 900);
            },

            attack: function() {
                if (this.isDead) {
                    this.showOverlay('💀', 'dead');
                    return;
                }
                this.hp = Math.max(0, this.hp - 25);
                this.status = 'attack';
                this.updateHp('animate__rubberBand');
                this.showOverlay('-25', 'negative');

                // Verificar si murió después del ataque
                if (this.hp === 0) {
                    this.status = 'dead';
                    this.isDead = true;
                    // Remover rubberBand y aplicar animación de muerte
                    pkImage.classList.remove('animate__rubberBand');
                    pkImage.classList.add('death-animation', 'dead');
                    // Actualizar HP y botones
                    pkHp.innerHTML = `HP: 0`;
                    this.updateButtons();
                    this.showOverlay('💀', 'dead');
                }
            },

            feed: function() {
                // Si está muerto, revivir con 25 HP
                if (this.isDead) {
                    this.isDead = false;
                    this.hp = 25;
                    this.status = 'alive';
                    pkImage.classList.remove('dead', 'death-animation');
                    this.updateHp('animate__rubberBand');
                    this.showOverlay('+25', 'positive');
                    return;
                }
                
                // Si ya está en maxHp, no hacer nada
                if (this.hp >= this.maxHp) {
                    return;
                }
                
                const oldHp = this.hp;
                this.hp = Math.min(this.maxHp, this.hp + 25);
                const gained = this.hp - oldHp;
                
                // Solo mostrar overlay si realmente ganó HP
                if (gained > 0) {
                    this.status = 'feed';
                    this.updateHp('animate__rubberBand');
                    this.showOverlay(`+${gained}`, 'positive');
                }
            }
        };

        pokemon.render();

        // Events 
        btnAttack.addEventListener('click', function() {
            pokemon.attack();
        });

        btnFeed.addEventListener('click', function() {
            pokemon.feed();
        });
    </script>
</body>

</html>
