</head>

<body>
    <main>
        <div class="contenedor-botones">
            <a href="../04-js/index4.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">

                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>

        </div>

        <header>
            <h1>Types and Objects</h1>
            <h2>Understand and work with different object types</h2>
        </header>

        <section>
            <ul class="objects"></ul>
        </section>
        <script>
            // Elements
            const objs = document.querySelector('.objects');

            // Objects String
            const string = new String('JavaScript 💛');
            objs.innerHTML = `<li>${string} → Object: ${string.constructor.name}</li>`;

            // Objects Number
            const number = new Number(256);
            objs.innerHTML += `<li>${number} → Object: ${number.constructor.name}</li>`;

            // Objects Boolean
            const bool = new Boolean(512>128);
            objs.innerHTML += `<li>${bool} → Object: ${bool.constructor.name}</li>`;

            // Objects Array
            const array = new Array('🛻', '🏍️', '🏎️');
            objs.innerHTML += `<li>${array} → Object: ${array.constructor.name}</li>`;

            // Objects Array
            const dt = new Date('12/12/2026');
            objs.innerHTML += `<li>${dt.getFullYear()} → Object: ${dt.constructor.name}</li>`;

            // Objects Object
            const obj = new Object('Vehicle');
            objs.innerHTML += `<li>${obj} → Object: ${obj.constructor.name}</li>`;
            
        </script>
    </main>
</body>

</html>
