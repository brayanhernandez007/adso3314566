<!DOCTYPE html>
<html lang="en">

<head>

    <title>12 - Colors Alpha</title>
    <link rel="stylesheet" href="../src/css/css.css">
    <style>
        figure.bugs_bunny {
            background: url('../src/img/si.png') no-repeat center/cover;
            border: 4px solid white;
            margin: 4rem auto;
            width: 300px;
            height: 300px;

            div {
                height: calc(300px / 3);
                &.box1 {
                    background-color: rgba(0, 0, 0, 0.716);
                }
                &.box2 {
                    background-color: rgba(0, 0, 0, 0.493);
                }
                &.box3 {
                    background-color: rgba(0, 0, 0, 0.253);
                }
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="contenedor-botones">

        <br>
        <main>
            <header>
                <h1>12 - Colors Alpha</h1>
                <h2>The fourth alpha channel allows you to apply opacity or transparency to the color.</h2>
            </header>
            <section>
                <h3>Example Transparent Colors:</h3>
                <figure class="bugs_bunny">
                    <div class="box1"></div>
                    <div class="box2"></div>
