<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Document Style</title>
    <link rel="stylesheet" href="../src/css/css.css">
    <style>
        /* ANULAR solo los estilos globales que afectan a las imágenes del grid */
        .caja-negra-individual .grid-item img {
            border: none !important;
            border-radius: 0 !important;
            animation: none !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            object-fit: cover !important;
        }

        /* Grid principal - 3 columnas */
        .grid-imagenes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto auto auto;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Estilos de las imágenes */
        .grid-item {
            overflow: hidden;
            position: relative;
            cursor: pointer;
            background-color: #2a2a2a;
            border-radius: 12px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            aspect-ratio: 1 / 1;
        }

        /* ANIMACIÓN FLOTANTE al hacer hover */
        .grid-item:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 30px rgba(187, 77, 255, 0.4);
            z-index: 10;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        /* Distribución de 7 imágenes */
        .item-1 {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }

        /* Imagen 2: VERTICAL - ocupa 2 filas */
        .item-2 {
            grid-column: 2 / 3;
            grid-row: 1 / 3;
            aspect-ratio: auto;
            min-height: 200px;
        }

        .item-3 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .item-4 {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }

        /* Imagen 5: HORIZONTAL - ocupa 2 columnas, altura normal */
        .item-5 {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
            aspect-ratio: auto;
            min-height: 0;
            height: auto;
        }

        /* Imagen 6: Cuadrada a la derecha */
        .item-6 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
        }

        /* Imagen 7: Cuadrada */
        .item-7 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        /* Ajuste para que la caja sea más pequeña */
        .caja-negra-individual {
            max-width: 650px !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 20px !important;
        }

        /* Asegurar que la horizontal tenga la misma altura */
        .grid-imagenes .item-5 {
            height: auto;
        }

        .grid-imagenes .item-5 img {
            height: 100%;
            width: 100%;
            object-fit: cover;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .grid-imagenes {
                max-width: 100%;
            }
            
            .grid-imagenes {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: auto;
            }

            .item-1,
            .item-2,
            .item-3,
            .item-4,
            .item-5,
            .item-6,
            .item-7 {
                grid-column: auto;
                grid-row: auto;
                aspect-ratio: 1 / 1;
                min-height: auto;
            }

            .item-2 {
                grid-column: 1 / 3;
                grid-row: auto;
                aspect-ratio: auto;
                min-height: 200px;
            }

            .item-5 {
                grid-column: 1 / 3;
                grid-row: auto;
                aspect-ratio: auto;
                min-height: 150px;
            }
        }

        @media (max-width: 480px) {
            .grid-imagenes {
                grid-template-columns: 1fr;
            }

            .item-1,
            .item-2,
            .item-3,
            .item-4,
            .item-5,
            .item-6,
            .item-7 {
                grid-column: 1;
                grid-row: auto;
                aspect-ratio: 1 / 1;
                min-height: auto;
            }

            .item-2 {
                aspect-ratio: auto;
                min-height: 200px;
            }

            .item-5 {
                aspect-ratio: auto;
                min-height: 150px;
            }
        }
    </style>
</head>

<body>
    <main>
        <!-- Navegación -->
        <div class="contenedor-botones">
            <a href="../03-css/index3.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#000" viewBox="0 0 256 256">
                    <path d="M232,56A104.11,104.11,0,0,1,128,160H51.31l34.35,34.34a8,8,0,0,1-11.32,11.32l-48-48a8,8,0,0,1,0-11.32l48-48a8,8,0,0,1,11.32,11.32L51.31,144H128a88.1,88.1,0,0,0,88-88,8,8,0,0,1,16,0Z">
                    </path>
                </svg>
            </a>

            <a href="../index.html" class="boton">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
                    <path d="M219.31,108.68l-80-80a16,16,0,0,0-22.62,0l-80,80A15.87,15.87,0,0,0,32,120v96a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V160h32v56a8,8,0,0,0,8,8h64a8,8,0,0,0,8-8V120A15.87,15.87,0,0,0,219.31,108.68ZM208,208H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48V120l80-80,80,80Z">
                    </path>
                </svg>
            </a>
        </div>

        <!-- Header -->
        <header>
            <h1>01 - Document Style</h1>
            <h2>Grid de 7 imágenes</h2>
        </header>

        <!-- Grid de imágenes -->
        <div class="caja-negra-individual">
            <div class="grid-imagenes">
                <!-- Imagen 1: Cuadrada -->
                <div class="grid-item item-1">
                    <img src="../src/img/grid 1.jpg" alt="Imagen 1">
                </div>

                <!-- Imagen 2: VERTICAL -->
                <div class="grid-item item-2">
                    <img src="../src/img/grid 2.jpg" alt="Imagen 2 Vertical">
                </div>

                <!-- Imagen 3: Cuadrada -->
                <div class="grid-item item-3">
                    <img src="../src/img/grid 3.jpg" alt="Imagen 3">
                </div>

                <!-- Imagen 4: Cuadrada -->
                <div class="grid-item item-4">
                    <img src="../src/img/grid 4.jpg" alt="Imagen 4">
                </div>

                <!-- Imagen 5: HORIZONTAL - misma altura que las demás -->
                <div class="grid-item item-5">
                    <img src="../src/img/grid 5.jpg" alt="Imagen 5 Horizontal">
                </div>

                <!-- Imagen 6: Cuadrada -->
                <div class="grid-item item-6">
                    <img src="../src/img/grid 6.jpg" alt="Imagen 6">
                </div>

                <!-- Imagen 7: Cuadrada -->
                <div class="grid-item item-7">
                    <img src="../src/img/grid 7.jpg" alt="Imagen 7">
                </div>
            </div>
        </div>
    </main>
</body>

</html>
