    <style>
        figure.frame {
            background: #433c3c;
            height: calc(70 * 20px);
            width: calc(70 * 20px);
            margin: 2rem auto;
            zoom: 0.60;
            position: relative;
        }

        /* --- CAPA DE LA IMAGEN DE FONDO (TRANSPARENTE) --- */
        div.background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* TU IMAGEN DE REFERENCIA */
            background-image: url();
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            image-rendering: pixelated;

            /* SOLO LA IMAGEN ES TRANSPARENTE */
            opacity: 0.3;

            pointer-events: none;
            /* Para que no estorbe al seleccionar */
            z-index: 1;
        }

        div.squares {
            background: url(../src/img/square.png);
            opacity: 0.2;
            z-index: 2;
            margin-top: -20px;
            height: calc(70 * 20px);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
        }
